<div class="container mt-5">
  <h2>Login</h2>

  <div class="form-group">
    <label>Mobile</label>
    <input [(ngModel)]="mobile" class="form-control" />
    <button (click)="sendOtp()" class="btn btn-primary mt-2">Send OTP</button>
  </div>

  <div *ngIf="otpSent" class="form-group mt-3">
    <label>OTP</label>
    <input [(ngModel)]="otp" class="form-control" />
    <button (click)="verifyOtp()" class="btn btn-success mt-2">Verify OTP</button>
  </div>

  <div class="text-danger mt-2" *ngIf="errorMessage">{{ errorMessage }}</div>
  <div class="text-success mt-2" *ngIf="message">{{ message }}</div>

  <div *ngFor="let shop of shops" class="mb-2">
  <button 
    class="btn btn-outline-primary w-100" 
    (click)="goToDashboard(shop.name)">
    {{ shop.name }}
  </button>

</div>
